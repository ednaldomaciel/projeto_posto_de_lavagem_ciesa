{% extends 'base.html' %}

{% block title %}Acesso ao Sistema{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-8">
        
        <!-- Topo com Logo -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white mx-auto shadow-lg mb-3">
                <i class="fa-solid fa-car-wash text-2xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 tracking-tight">Lava Jato do Valmir</h2>
            <p class="text-xs text-slate-500 mt-1">Controle de Atendimento, Pátio e Gestão</p>
        </div>

        <!-- Formulário de Login Tradicional -->
        <form method="POST" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Usuário / Login</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" placeholder="Digite seu usuário" required
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Senha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" placeholder="Digite sua senha" required
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Acessar Sistema
            </button>
        </form>

    </div>
</div>
{% endblock %}
