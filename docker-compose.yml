services:
  db:
    image: postgres:16-alpine
    container_name: lavajato_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lavajato_db}
      POSTGRES_USER: ${POSTGRES_USER:-lavajato_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: lavajato_web
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lavajato_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lavajato_db}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
