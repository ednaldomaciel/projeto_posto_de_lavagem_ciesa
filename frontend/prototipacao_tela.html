<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posto de Lavagem - Nova Ordem de Serviço</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --primary: #0d6efd;
            --primary-hover: #0b5ed7;
            --success: #198754;
            --warning-bg: #fff3cd;
            --warning-text: #664d03;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
            color: var(--primary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            font-size: 0.88rem;
            margin-bottom: 6px;
        }

        input[type="text"], select, textarea {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        /* Alerta de Regra de Negócio (RN01) */
        .alert-faturado {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid #ffe69c;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 0.88rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Checkbox de Serviços */
        .services-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .service-item {
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .service-item:hover {
            border-color: var(--primary);
        }

        .service-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .service-price {
            font-weight: bold;
            color: var(--success);
        }

        /* Opções de Pagamento (RN02) */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Resumo do Valor Total */
        .total-box {
            background: #e7f1ff;
            border: 1px solid #b6d4fe;
            padding: 15px 20px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .total-amount {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .btn-submit {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #146c43;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-actions">
            <h2>📝 Nova Ordem de Serviço</h2>
            <a href="index.html" class="btn-secondary">← Voltar ao Pátio</a>
        </div>

        <form id="formNovaOS">
            
            <!-- SEÇÃO 1: VEÍCULO E CLIENTE -->
            <div class="card">
                <div class="card-title">1. Dados do Veículo e Cliente</div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="placa">Placa do Veículo *</label>
                        <input type="text" id="placa" placeholder="ABC-1234 ou ABC1D23" required style="text-transform: uppercase;">
                    </div>

                    <div class="form-group">
                        <label for="modelo">Modelo</label>
                        <input type="text" id="modelo" placeholder="Ex: Corolla" required>
                    </div>

                    <div class="form-group">
                        <label for="marca">Marca</label>
                        <input type="text" id="marca" placeholder="Ex: Toyota">
                    </div>

                    <div class="form-group">
                        <label for="tipoCliente">Tipo de Cliente</label>
                        <select id="tipoCliente">
                            <option value="Comum">Comum</option>
                            <option value="Faturado" selected>Faturado (Mensalista)</option>
                        </select>
                    </div>
                </div>

                <!-- Alerta RN01 (Validação de limite semanal para faturado) -->
                <div class="alert-faturado">
                    ⚠️ <strong>Atenção (RN01):</strong> Cliente faturado. O sistema identificou 0 lavagens realizadas nos últimos 7 dias. Limite disponível: 1 lavagem.
                </div>
            </div>

            <!-- SEÇÃO 2: SERVIÇOS E ATRIBUIÇÃO -->
            <div class="card">
                <div class="card-title">2. Serviços e Profissional</div>

                <div class="form-group">
                    <label>Selecione os Serviços Desejados *</label>
                    <div class="services-list">
                        <label class="service-item">
                            <div class="service-info">
                                <input type="checkbox" name="servico" value="45.00" checked>
                                <span>Lavagem Simples</span>
                            </div>
                            <span class="service-price">R$ 45,00</span>
                        </label>

                        <label class="service-item">
                            <div class="service-info">
                                <input type="checkbox" name="servico" value="70.00">
                                <span>Lavagem Completa</span>
                            </div>
                            <span class="service-price">R$ 70,00</span>
                        </label>

                        <label class="service-item">
                            <div class="service-info">
                                <input type="checkbox" name="servico" value="30.00">
                                <span>Aplicação de Cera</span>
                            </div>
                            <span class="service-price">R$ 30,00</span>
                        </label>

                        <label class="service-item">
                            <div class="service-info">
                                <input type="checkbox" name="servico" value="120.00">
                                <span>Higienização Interna</span>
                            </div>
                            <span class="service-price">R$ 120,00</span>
                        </label>
                    </div>
                </div>

                <div class="form-grid" style="margin-top: 15px;">
                    <div class="form-group">
                        <label for="lavador">Lavador Responsável (RF03) *</label>
                        <select id="lavador" required>
                            <option value="">Selecione o lavador...</option>
                            <option value="1">Carlos Silva (Comissão 10%)</option>
                            <option value="2">João Pedro (Comissão 10%)</option>
                            <option value="3">Marcos Souza (Comissão 12%)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="previsao">Previsão de Entrega</label>
                        <input type="text" id="previsao" value="45 minutos" readonly style="background-color: #e9ecef;">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="observacoes">Observações / Avarias Pré-existentes</label>
                    <textarea id="observacoes" rows="2" placeholder="Ex: Risco no para-lama traseiro direito, retirar objetos do console..."></textarea>
                </div>
            </div>

            <!-- SEÇÃO 3: PAGAMENTO (RN02) -->
            <div class="card">
                <div class="card-title">3. Condições de Pagamento (RN02)</div>

                <div class="form-group">
                    <label>Momento da Quitação *</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="momentoPagamento" value="Entrada">
                            <span>Pagamento na Entrada</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="momentoPagamento" value="Retirada" checked>
                            <span>Pagamento na Retirada</span>
                        </label>
                    </div>
                </div>

                <div class="total-box">
                    <span>Valor Total Estimado:</span>
                    <span class="total-amount">R$ 45,00</span>
                </div>

                <button type="submit" class="btn-submit">✅ Confirmar e Emitir Ordem de Serviço</button>
            </div>

        </form>

    </div>

</body>
</html>
